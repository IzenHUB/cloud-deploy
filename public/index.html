<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API tester</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 900px; margin: 40px auto; padding: 0 20px; color: #222; font: 15px/1.5 system-ui, sans-serif; }
    h1 { margin-bottom: 4px; font-size: 24px; }
    p { margin-top: 0; color: #666; }
    form { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; margin: 24px 0 18px; }
    input, select, textarea, button { border: 1px solid #ccc; border-radius: 5px; padding: 10px; font: inherit; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #aaa; outline-offset: 1px; }
    button { background: #222; color: white; border-color: #222; cursor: pointer; padding-inline: 18px; }
    button:disabled { opacity: .6; cursor: wait; }
    label { display: block; margin: 14px 0 5px; font-weight: 600; }
    textarea { display: block; width: 100%; min-height: 150px; resize: vertical; font: 13px/1.5 ui-monospace, monospace; }
    .response-head { display: flex; align-items: center; gap: 12px; margin: 24px 0 8px; }
    .response-head h2 { margin: 0; font-size: 18px; }
    #status { color: #666; font-size: 13px; }
    pre { min-height: 120px; margin: 0; padding: 14px; overflow: auto; border: 1px solid #ddd; border-radius: 5px; background: #fafafa; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 ui-monospace, monospace; }
    @media (max-width: 560px) { body { margin-top: 24px; } form { grid-template-columns: 1fr auto; } form select { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <h1>API tester</h1>
  <p>A tiny place to send requests and see what comes back.</p>

  <form id="request-form">
    <select id="method" aria-label="HTTP method">
      <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
    </select>
    <input id="url" type="text" value="/api/users" aria-label="Request URL" required>
    <button id="send" type="submit">Send</button>
  </form>

  <label for="body">JSON body</label>
  <textarea id="body" spellcheck="false" placeholder='{"username":"sam","email":"sam@example.com","password":"secret","age":25}'></textarea>

  <div class="response-head"><h2>Response</h2><span id="status">Nothing sent yet</span></div>
  <pre id="response" aria-live="polite">Your response will show up here.</pre>

  <script>
    const form = document.querySelector('#request-form');
    const methodInput = document.querySelector('#method');
    const bodyInput = document.querySelector('#body');
    const urlInput = document.querySelector('#url');
    const sendButton = document.querySelector('#send');
    const status = document.querySelector('#status');
    const output = document.querySelector('#response');

    function updateBodyVisibility() {
      const hasBody = methodInput.value === 'POST' || methodInput.value === 'PUT';
      bodyInput.disabled = !hasBody;
      document.querySelector('label[for="body"]').hidden = !hasBody;
      bodyInput.hidden = !hasBody;
    }

    methodInput.addEventListener('change', updateBodyVisibility);
    updateBodyVisibility();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const method = methodInput.value;
      const request = { method, headers: {} };
      if (method === 'POST' || method === 'PUT') {
        if (bodyInput.value.trim()) {
          try {
            request.headers['Content-Type'] = 'application/json';
            request.body = JSON.stringify(JSON.parse(bodyInput.value));
          } catch {
            status.textContent = 'Invalid JSON';
            output.textContent = 'Check the JSON body and try again.';
            bodyInput.focus();
            return;
          }
        }
      }

      sendButton.disabled = true;
      status.textContent = 'Sending…';
      output.textContent = '';
      const started = performance.now();
      try {
        const response = await fetch(urlInput.value, request);
        const text = await response.text();
        let formatted = text || '(empty response)';
        try { formatted = JSON.stringify(JSON.parse(text), null, 2); } catch { /* Keep plain text responses as-is. */ }
        status.textContent = `${response.status} ${response.statusText} · ${Math.round(performance.now() - started)} ms`;
        output.textContent = formatted;
      } catch (error) {
        status.textContent = 'Request failed';
        output.textContent = error.message + '\n\nCheck the URL and make sure the API is running.';
      } finally {
        sendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
